[package]
name = "clacker"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LudeeD/clacker"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dom_smoothie = "0.18.0"
htmd = "0.5.5"
serde_json = "1.0.151"
tiny_http = "0.12.0"
ureq = "3.4.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
